<!DOCTYPE html>  <html lang="es">  
<head>  
<meta charset="UTF-8">  
<title>Intro PRO</title>  

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">  

<style>  
body {  
  margin: 0;  
  overflow: hidden;  
  font-family: 'Orbitron', sans-serif;  
  background: black;  
}  
  
/* CAPA BLANCA */  
.capa-blanca {  
  position: fixed;  
  top: 0;  
  left: 0;  
  width: 100%;  
  height: 100%;  
  background: white;  
  opacity: 0;  
  pointer-events: none;  
  transition: opacity 1.5s ease;  
}  
  
/* FONDO */  
.fondo {  
  position: absolute;  
  width: 100%;  
  height: 100%;  
  background: radial-gradient(circle, rgba(255,120,0,0.2), transparent);  
  animation: pulso 3s infinite;  
}  
  
@keyframes pulso {  
  0% { opacity: 0.1; }  
  50% { opacity: 0.4; }  
  100% { opacity: 0.1; }  
}  
  
#pantalla {  
  display: flex;  
  justify-content: center;  
  align-items: center;  
  height: 100vh;  
}  
  
/* TEXTO */  
.texto {  
  font-size: 55px;  
  letter-spacing: 6px;  
  text-align: center;  
  opacity: 0;  
  transform: scale(0.7);  
  filter: blur(20px);  
  transition: opacity 0.8s ease, filter 0.8s ease, transform 0.8s ease;  
}  
  
/* FUEGO */  
.fuego {  
  color: white;  
  text-shadow:  
    0 0 10px rgba(255,120,0,0.8),  
    0 0 20px rgba(255,80,0,0.7),  
    0 0 40px rgba(255,50,0,0.6);  
}  
  
/* ANIMACIÓN */  
.aparecer {  
  animation: aparecerPro 2s forwards;  
}  
  
@keyframes aparecerPro {  
  0% {  
    opacity: 0;  
    transform: scale(0.5);  
    filter: blur(30px);  
  }  
  60% {  
    opacity: 1;  
    transform: scale(1.1);  
    filter: blur(0px);  
  }  
  100% {  
    transform: scale(1);  
    filter: blur(0px);  
    opacity: 1;  
  }  
}  
</style>  

</head>  

<body>  

<div class="fondo"></div>  
<div class="capa-blanca" id="capa"></div>  

<div id="pantalla">  
  <div id="texto" class="texto fuego aparecer">CreadoPorF ✓</div>  
</div>  

<audio id="sonido" src="https://www.myinstants.com/media/sounds/fire-whoosh.mp3"></audio>

<script>  
let texto = document.getElementById("texto");  
let sonido = document.getElementById("sonido");  
let capa = document.getElementById("capa");  
  
// sonido inicial  
sonido.play();  
  
// PASO 1 → CAMBIAR A 4 EN RAYA  
setTimeout(() => {  
  texto.style.opacity = 0;  
  
  setTimeout(() => {  
    texto.innerText = "4 EN RAYA";  
  
    texto.classList.remove("aparecer");  
    void texto.offsetWidth;  
    texto.classList.add("aparecer");  
  
    sonido.currentTime = 0;  
    sonido.play();  
  }, 300);  
  
}, 3000);  
  
// PASO 2 → FONDO BLANCO + ELIMINAR TEXTO REAL  
setTimeout(() => {  
  
  // fondo blanco progresivo  
  capa.style.opacity = 1;  
  
  // quitar animación para evitar bug  
  texto.classList.remove("aparecer");  
  texto.style.animation = "none";  
  
  // desaparecer suave  
  texto.style.opacity = "0";  
  texto.style.filter = "blur(20px)";  
  texto.style.transform = "scale(0.8)";  
  
  // eliminar completamente (NO vuelve a aparecer)  
  setTimeout(() => {  
    texto.style.display = "none";  
    
    // 🔥 SOLO ESTA LÍNEA SE AGREGÓ
    parent.nav("menu");
    
  }, 800);  
  
}, 6000);  
</script>  

</body>  
</html>
